# Docker Compose configuration for local KubeChain development services
# Provides Redis for sliding-window rate limiting and deterministic RPC response caching

services:
  redis:
    image: redis:7.2-alpine
    container_name: kubechain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - kubechain-local
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 64M

volumes:
  redis_data:
    driver: local

networks:
  kubechain-local:
    driver: bridge
