# Deterministic Anvil EVM development node deployment for local testing.
# IMPORTANT: Anvil is a single-node local development tool, not a production
# Ethereum execution/consensus client. Do not scale replicas > 1 expecting
# shared or synchronized blockchain state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-dev
  namespace: kubechain-nodes
  labels:
    app.kubernetes.io/name: anvil
    app.kubernetes.io/instance: anvil-dev
    app.kubernetes.io/component: evm-dev-node
    app.kubernetes.io/part-of: kubechain
spec:
  replicas: 1
  strategy:
    # Recreate ensures the single ReadWriteOnce PVC is detached before the new pod mounts it
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil
      app.kubernetes.io/instance: anvil-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil
        app.kubernetes.io/instance: anvil-dev
        app.kubernetes.io/component: evm-dev-node
        app.kubernetes.io/part-of: kubechain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anvil
          image: ghcr.io/foundry-rs/foundry:latest
          imagePullPolicy: IfNotPresent
          command: ["anvil"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8545"
            - "--chain-id"
            - "31337"
            - "--mnemonic"
            - "test test test test test test test test test test test junk"
            - "--accounts"
            - "10"
            - "--balance"
            - "10000"
            - "--block-time"
            - "2"
            - "--state"
            - "/data/anvil-state.json"
            - "--state-interval"
            - "10"
          ports:
            - name: json-rpc
              containerPort: 8545
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: anvil-state
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          # Blockchain-specific probes using Foundry's `cast` CLI (JSON-RPC POST),
          # rather than a raw TCP socket check.
          startupProbe:
            exec:
              command:
                - "cast"
                - "chain-id"
                - "--rpc-url"
                - "http://127.0.0.1:8545"
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          readinessProbe:
            exec:
              command:
                - "cast"
                - "block-number"
                - "--rpc-url"
                - "http://127.0.0.1:8545"
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - "cast"
                - "chain-id"
                - "--rpc-url"
                - "http://127.0.0.1:8545"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: anvil-state
          persistentVolumeClaim:
            claimName: anvil-dev-state
        - name: tmp-dir
          emptyDir: {}
